name: docs-harness

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  DATAPACK_HARNESS_ROOT: skills/datapack-smith

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation check dependencies
        run: python -m pip install -r "$DATAPACK_HARNESS_ROOT/tools/requirements-dev.txt"
      - name: Validate OKF metadata and indexes
        run: |
          python "$DATAPACK_HARNESS_ROOT/tools/okf_index.py" --conformance-only
          python "$DATAPACK_HARNESS_ROOT/tools/okf_index.py"
      - name: Validate profiles
        run: python "$DATAPACK_HARNESS_ROOT/tools/datapack_harness.py" profiles
      - name: Run harness tests
        run: python -m unittest discover -s tests -v
